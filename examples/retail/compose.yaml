#
# Run from this directory: docker compose up --build
# Build contexts are the repository root so the API can install its seven local
# packages and both web apps can resolve the whole npm workspace.

name: commerce-retail

services:
  api:
    build:
      context: ../..
      dockerfile: examples/retail/Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple/}
    # Optional: credentials are injected at runtime, never baked into the image.
    env_file:
      - path: ../../.env
        required: false
      - path: ./.env
        required: false
    # FastAPI rejects unknown Host headers (DNS-rebinding guard). Put the public domain
    # in ../../.env as DEMO_ALLOWED_HOSTS=... ; env_file passes it straight through.
    # Do NOT re-declare it under `environment` with ${VAR:-}: an unset shell var expands
    # to "" and overrides the env_file value with an empty string.
    ports:
      - "8100:8100"
    # The retail demo persists memory and merchant edits back into data/.
    volumes:
      - ./data:/repo/examples/retail/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  storefront:
    build:
      context: ../..
      dockerfile: examples/retail/Dockerfile.web
      args:
        APP: storefront
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/agent/api}
        BASE_PATH: ${STOREFRONT_BASE_PATH:-/agent-shopping}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  merchant:
    build:
      context: ../..
      dockerfile: examples/retail/Dockerfile.web
      args:
        APP: merchant
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/agent/api}
        BASE_PATH: ${MERCHANT_BASE_PATH:-/agent-merchant}
    ports:
      - "3100:3100"
    depends_on:
      api:
        condition: service_healthy
